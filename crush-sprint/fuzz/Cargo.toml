[package]
name = "crush-sprint-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Not part of the parent workspace (it's in the root's `exclude` too, but
# cargo-fuzz needs this to build the crate).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
crush-core = { path = "../../crush-core" }
crush-parallel = { path = "../../crush-parallel" }
crush-sprint = { path = ".." }

[[bin]]
name = "fuzz_decompress"
path = "fuzz_targets/fuzz_decompress.rs"
test = false
bench = false
doc = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
bench = false
doc = false

[[bin]]
name = "fuzz_tables"
path = "fuzz_targets/fuzz_tables.rs"
test = false
bench = false
doc = false
