[package]
name = "crush-lz"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Fast LZ4-class compression plugin (fast-lz) for Crush"

[lib]
name = "crush_lz"
path = "src/lib.rs"

[dependencies]
crush-core = { version = "0.4.0", path = "../crush-core" }
linkme = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Only for the shared bench generators (crush-parallel/benches/common/variants.rs).
libdeflater = { workspace = true }
proptest = "1.11"

[[bench]]
name = "codec"
harness = false

[lints.clippy]
all = "deny"
pedantic = "warn"
