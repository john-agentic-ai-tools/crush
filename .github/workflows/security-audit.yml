name: Security Audit

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        run: cargo audit --deny warnings

      # The fuzz crates are excluded from the workspace and keep their own
      # lockfiles, so the audit above does not cover them.
      - name: Run security audit (fuzz lockfiles)
        run: |
          for manifest in crush-core/fuzz crush-parallel/fuzz crush-gpu/fuzz; do
            if [ -f "$manifest/Cargo.lock" ]; then
              echo "=== Auditing $manifest/Cargo.lock ==="
              cargo audit --deny warnings --file "$manifest/Cargo.lock"
            else
              echo "=== Skipping $manifest (no Cargo.lock) ==="
            fi
          done

  supply_chain:
    name: Supply Chain Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses, bans, sources, and advisories
        run: cargo deny check
