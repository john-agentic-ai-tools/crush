# Codecov configuration for Crush
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

  ignore:
    # Experimental GPU code - requires hardware, tests auto-skip in CI
    - "crush-parallel/src/gpu/**"
    # Benchmark code - not part of production
    - "*/benches/**"
    # Fuzz targets - tested separately
    - "*/fuzz/**"
    # Test fixtures
    - "*/tests/fixtures/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
