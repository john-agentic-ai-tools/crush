[workspace]
resolver = "2"
members = [
    "crush-core",
    "crush-cli",
    "crush-parallel",
]
exclude = [
    "crush-core/fuzz",
    "crush-parallel/fuzz",
]

[workspace.package]
edition = "2021"
authors = ["Crush Contributors"]
license = "MIT"
repository = "https://github.com/john-agentic-ai-tools/crush"
homepage = "https://github.com/john-agentic-ai-tools/crush"

[workspace.dependencies]
linkme = "0.3"
crossbeam = "0.8"
rayon = "1.10"
flate2 = { version = "1.1", features = ["zlib"] }
libdeflater = "1.25.2"
crc32fast = "1.4"
memmap2 = "0.9"
thiserror = "2.0.18"
criterion = "0.8.2"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
