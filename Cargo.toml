[workspace]
resolver = "2"
members = [
    "crush-core",
    "crush-cli",
    "crush-parallel",
    "crush-gpu",
]
exclude = [
    "crush-core/fuzz",
    "crush-parallel/fuzz",
    "crush-gpu/fuzz",
]

[workspace.package]
edition = "2021"
authors = ["Crush Contributors"]
license = "MIT"
repository = "https://github.com/john-agentic-ai-tools/crush"
homepage = "https://github.com/john-agentic-ai-tools/crush"

[workspace.dependencies]
linkme = "0.3.37"
crossbeam = "0.8.4"
rayon = "1.12"
flate2 = { version = "1.1.9", features = ["zlib"] }
libdeflater = "1.25.2"
crc32fast = "1.5"
# 0.9.11 patches RUSTSEC-2026-0186: unchecked pointer offset in
# `advise_range`/`flush_range`. Keep this floor explicit — Cargo.lock is
# gitignored, so the manifest is the only thing pinning consumers off the
# unsound versions.
memmap2 = "0.9.11"
thiserror = "2.0.19"
criterion = "0.8.2"
wgpu = "28.0"
bytemuck = "1.25"
pollster = "1.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
